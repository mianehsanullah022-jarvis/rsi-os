<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RSI OS</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://hmxfiyzinxihanckmuil.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--top:#000;--side:#ebebeb;--bg:#f1f1f1;--card:#fff;--ink:#303030;--strong:#1a1a1a;--muted:#616161;--line:#e3e3e3;--hover:#f7f7f7;
 --red:#e11d2e;--red-d:#b8121f;--green:#0f7a43;--gbg:#cdfee1;--ybg:#ffeb78;--yink:#4f4700;--bbg:#e0f0ff;--bink:#00527c;--gray:#e3e3e3;--rbg:#fedad9;--rink:#8e1f0b;
 --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:400 14px/1.45 var(--font);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid #005bd3;outline-offset:1px}
.hidden{display:none!important}
/* layout */
.top{height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;position:sticky;top:0;z-index:20}
.top img{height:30px}
.search{flex:1;max-width:560px;margin:0 auto;position:relative}
.top .search input{width:100%;background:#303030;border:1px solid #4a4a4a;color:#fff;border-radius:10px;padding:8px 12px 8px 34px}
.search input::placeholder{color:#b5b5b5}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#b5b5b5}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:30px;height:30px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:700}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{background:var(--side);padding:10px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--strong)}
.side a:hover{background:#e0e0e0}
.side a.on{background:#fafafa}
.side a .cnt{margin-left:auto;background:#d4d4d4;border-radius:8px;padding:0 7px;font-size:12px}
.side .sep{height:1px;background:#d4d4d4;margin:10px 6px}
.side .storelink{font-weight:500;color:var(--muted)}
main{padding:20px 24px 80px;max-width:1100px;width:100%;min-width:0;margin:0 auto}
@media(max-width:820px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #d4d4d4}
 .side a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
 .side a .cnt{position:absolute;margin:0 0 0 18px;font-size:10px;background:var(--red);color:#fff}
 .side .sep,.side .storelink,.side .hide-m{display:none}
 main{padding:14px 12px 90px}
 .search{display:none}
}
/* feature switches */
.fsec{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #ebebeb}
.frow:first-of-type{border-top:0}
.frow .ft{flex:1;min-width:0}.frow .ft b{display:block;color:var(--strong)}.frow .ft span{color:var(--muted);font-size:13px}
.tg{position:relative;width:44px;height:26px;flex:none}
.tg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;border-radius:13px;background:#c9c9c9;transition:background .2s}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked+i{background:#0f8a4b}
.tg input:checked+i::after{transform:translateX(18px)}
.tg input:focus-visible+i{outline:2px solid #005bd3;outline-offset:2px}
.frow.dim{opacity:.45}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.btn.rcpt{padding:6px 10px}
/* common */
h1{font-size:20px;margin:0;color:var(--strong);font-weight:700}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ph .sp{flex:1}
.back{border:0;background:#e3e3e3;width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 0 rgba(26,26,26,.07),0 0 0 1px rgba(26,26,26,.05);padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--strong)}
.btn{border:0;background:#fff;box-shadow:0 0 0 1px #d4d4d4 inset,0 1px 0 #d4d4d4;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:#303030;color:#fff;box-shadow:0 1px 0 #000}
.btn.pri:hover{background:#1a1a1a}
.btn.red{background:var(--red);color:#fff;box-shadow:none}
.btn.wa{background:#25d366;color:#fff;box-shadow:none}
.btn.danger{color:var(--rink)}
.btn[disabled]{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:600;background:var(--gray);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.p-pending{background:var(--ybg);color:var(--yink)}
.p-confirmed,.p-packed{background:var(--bbg);color:var(--bink)}
.p-shipped{background:#eae4ff;color:#4b2fa3}
.p-delivered,.p-paid{background:var(--gbg);color:var(--green)}
.p-cancelled,.p-returned{background:var(--gray);color:var(--muted)}
.p-unpaid{background:#ffd6a4;color:#5e4200}
.p-refunded{background:var(--rbg);color:var(--rink)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 0 rgba(26,26,26,.07),0 0 0 1px rgba(26,26,26,.05);text-decoration:none;display:block}
.kpi .l{color:var(--muted);font-weight:600;font-size:13px}
.kpi .v{font-size:22px;font-weight:700;color:var(--strong);margin-top:4px}
.kpi.alert .v{color:var(--red)}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.chart{width:100%;height:180px}
.chart rect{fill:#303030}
.chart rect.today{fill:var(--red)}
.chart text{font-size:10px;fill:var(--muted)}
/* tables */
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--side);color:var(--strong)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;background:#f7f7f7;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl .r{text-align:right;white-space:nowrap}
.tbl b{color:var(--strong)}
.tcard{padding:0;overflow:hidden}
.tcard .tools{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.tcard .tools input{flex:1;border:1px solid #8a8a8a;border-radius:8px;padding:6px 10px}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--side);border:1px solid var(--line);flex:none}
.noimg{display:grid;place-items:center;font-size:11px;color:var(--muted)}
@media(max-width:700px){.tbl .hm{display:none}.tbl td,.tbl th{padding:9px 8px}}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
/* detail */
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.sumrow{display:flex;justify-content:space-between;padding:3px 0}
.sumrow.t{font-weight:700;color:var(--strong);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-weight:600;margin:10px 0 4px;color:var(--strong)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],input:not([type]),select,textarea{width:100%;border:1px solid #8a8a8a;border-radius:8px;padding:8px 10px;background:#fff;font-size:14px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}}
.kv{display:grid;gap:2px;margin-bottom:10px}
.kv a{color:#005bd3}
.check{display:flex;gap:8px;align-items:center;font-weight:600;margin:10px 0}
.check input{width:18px;height:18px;accent-color:#303030}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .im{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;width:24px;height:24px;cursor:pointer}
.drop{width:96px;height:96px;border:1.5px dashed #8a8a8a;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-weight:600;text-align:center;font-size:12.5px}
.savebar{position:sticky;bottom:0;background:#1a1a1a;color:#fff;padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;margin-top:10px;z-index:10}
.savebar .sp{flex:1}
.savebar .btn{color:var(--strong)}
@media(max-width:820px){.savebar{bottom:70px}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140px);visibility:hidden;background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:90;transition:transform .2s}
.toast.on{transform:translate(-50%,0);visibility:visible}
@media(max-width:820px){.toast{bottom:84px}}
.banner{background:#fff1e3;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;box-shadow:0 0 0 1px #ffd6a4 inset}
.banner b{color:#5e4200}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:#000;padding:16px}
.login .card{width:min(400px,100%);padding:28px}
.login img{height:56px;margin:0 auto 6px;display:block}
.login h1{text-align:center;margin-bottom:4px}
.login p{text-align:center;margin:0 0 10px}
.err{color:var(--rink);background:var(--rbg);border-radius:8px;padding:8px 10px;margin-top:10px;font-weight:600}
.err:empty{display:none}
.linkbtn{border:0;background:none;color:#005bd3;cursor:pointer;padding:0;font-weight:600}
@media print{.top,.side,.ph .btn,.savebar{display:none!important}}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <form class="card" id="lf">
    <img src="wordmark.webp" alt="RSI Accessories" width="132" height="56">
    <h1>RSI OS</h1>
    <p class="muted" id="lmode">Log in to manage your orders</p>
    <label for="le">Email</label><input id="le" type="email" autocomplete="username" required>
    <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" minlength="6" required>
    <div class="err" id="lerr"></div>
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:14px;padding:10px" id="lbtn">Log in</button>
    <p style="margin-top:14px"><button type="button" class="linkbtn" id="lswap">First time? Create your admin password</button></p>
  </form>
</div>

<div id="os" class="hidden">
  <div class="top">
    <img src="wordmark.webp" alt="RSI" width="71" height="30">
    <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gsearch" placeholder="Search orders by number, name or phone"></div>
    <div class="me"><div class="av">R</div><button class="btn" id="logout" style="background:#303030;color:#fff;box-shadow:none">Log out</button></div>
  </div>
  <div class="shell">
    <nav class="side" aria-label="Main">
      <a href="#/home" data-r="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9H3z"/></svg>Home</a>
      <a href="#/orders" data-r="orders"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Orders<span class="cnt hidden" id="pendCnt"></span></a>
      <a href="#/products" data-r="products"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7"/></svg>Products</a>
      <a href="#/customers" data-r="customers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Customers</a>
      <a href="#/settings" data-r="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
      <div class="sep"></div>
      <a class="storelink" href="https://mianehsanullah022-jarvis.github.io/rsi-store/" target="_blank" rel="noopener">View online store ↗</a>
    </nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SB="https://hmxfiyzinxihanckmuil.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhteGZpeXppbnhpaGFuY2ttdWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzE3MTAsImV4cCI6MjEwODYwNzcxMH0.qBkAZbqFFUU6mRsii6ff15Vd8FM4r-CApDgRQdjNdIg";
const STORE_URL="https://mianehsanullah022-jarvis.github.io/rsi-store/";
const $=s=>document.querySelector(s);
const M=$("#main");
const rs=n=>"Rs "+Math.round(Number(n||0)).toLocaleString("en-PK");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)}
const ST=["pending","confirmed","packed","shipped","delivered","cancelled","returned"];
const STN={pending:"Pending",confirmed:"Confirmed",packed:"Packed",shipped:"Shipped",delivered:"Delivered",cancelled:"Cancelled",returned:"Returned"};
const PAYN={cod:"Cash on Delivery",jazzcash:"JazzCash",easypaisa:"Easypaisa",bank:"Bank transfer"};
const COURIERS=["TCS","Leopards","M&P","PostEx","Trax","Call Courier","BlueEx","Pakistan Post","Own rider"];
const pill=s=>`<span class="pill p-${s}">${STN[s]||s[0].toUpperCase()+s.slice(1)}</span>`;
const fdate=d=>new Date(d).toLocaleString("en-PK",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const day=d=>{const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};
const phone92=p=>{let n=String(p||"").replace(/\D/g,"");if(n.startsWith("0"))n="92"+n.slice(1);if(n.length===10)n="92"+n;return n};

/* ---------- auth ---------- */
let sess=ls.get("rsi_os_sess",null);
async function auth(path,body){
  const r=await fetch(SB+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Login failed");
  return j;
}
function keep(j){sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,email:j.user&&j.user.email};ls.set("rsi_os_sess",sess)}
async function token(){
  if(!sess)throw new Error("auth");
  if(Date.now()>sess.exp){try{keep(await auth("token?grant_type=refresh_token",{refresh_token:sess.rt}))}catch{logout();throw new Error("auth")}}
  return sess.at;
}
async function api(path,opt={}){
  const at=await token();
  const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+at,"Content-Type":"application/json",Prefer:"return=representation",...(opt.headers||{})}});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{}
  if(r.status===401){logout();throw new Error("auth")}
  if(!r.ok)throw new Error((j&&(j.message||j.error))||"Request failed");
  return j;
}
let signup=false;
$("#lswap").onclick=()=>{signup=!signup;$("#lmode").textContent=signup?"Create your admin password (use your admin email)":"Log in to manage your orders";$("#lbtn").textContent=signup?"Create password & log in":"Log in";$("#lswap").textContent=signup?"Already have a password? Log in":"First time? Create your admin password";$("#lp").autocomplete=signup?"new-password":"current-password"};
$("#lf").onsubmit=async e=>{
  e.preventDefault();$("#lerr").textContent="";const b=$("#lbtn");b.disabled=true;
  const email=$("#le").value.trim(),password=$("#lp").value;
  try{
    if(signup){await auth("signup",{email,password})}
    keep(await auth("token?grant_type=password",{email,password}));
    const ok=await api("/rest/v1/admins?select=email");
    if(!ok.length){logout();throw new Error("This email is not an admin of RSI OS.")}
    start();
  }catch(ex){$("#lerr").textContent=ex.message==="Invalid login credentials"?"Wrong email or password.":ex.message}
  b.disabled=false;
};
function logout(){sess=null;ls.del("rsi_os_sess");$("#os").classList.add("hidden");$("#login").classList.remove("hidden")}
$("#logout").onclick=logout;

/* ---------- data ---------- */
let orders=[],products=[],settings={store:{},payments:{}},lastMax=0;
async function loadAll(){
  const [o,p,s]=await Promise.all([
    api("/rest/v1/orders?select=*&order=created_at.desc&limit=2000"),
    api("/rest/v1/products?select=*&order=sort.asc,created_at.asc"),
    api("/rest/v1/settings?select=*")]);
  orders=o;products=p;for(const x of s)settings[x.key]=x.value;
  lastMax=Math.max(0,...orders.map(o=>o.order_no));badge();
}
function badge(){const n=orders.filter(o=>o.status==="pending").length;const c=$("#pendCnt");c.textContent=n;c.classList.toggle("hidden",!n);document.title=(n?`(${n}) `:"")+"RSI OS"}

async function poll(){

      if(fon("os_notify")&&"Notification" in window&&Notification.permission==="granted")new Notification("New RSI order",{body:`RSI-${n[0].order_no} • ${n[0].customer_name} • ${rs(n[0].total)}`,icon:"icon-192.png"});

/* full refresh every 2 minutes: picks up status, stock, product and settings changes */
async function refresh(){
  if(!sess||document.hidden||!fon("os_refresh"))return;
  const r=location.hash||"#/home",parts=r.slice(2).split("/");

/* ---------- router ---------- */
function route(){
  const [,a,b]=(location.hash.slice(1)||"/home").split("/");
  document.querySelectorAll(".side a[data-r]").forEach(x=>x.classList.toggle("on",x.dataset.r===(a||"home")));
  window.scrollTo(0,0);
  if(a==="orders"&&b==="new")return newOrder();
  if(a==="orders"&&b)return orderView(+b);
  if(a==="orders")return ordersView();
  if(a==="products"&&b)return productEdit(b);
  if(a==="products")return productsView();
  if(a==="customers")return customersView();
  if(a==="settings")return settingsView();
  homeView();
}
addEventListener("hashchange",route);
$("#gsearch").addEventListener("keydown",e=>{if(e.key==="Enter"){oq=e.target.value;otab="all";location.hash="#/orders";route()}});

  const low=products.filter(p=>p.active&&p.stock<=3);

    <div class="kpi"><div class="l">This month</div><div class="v">${rs(mOrders.reduce((a,o)=>a+o.total,0))}</div><div class="muted">${mOrders.length} orders${known&&mOrders.length?` • profit ${rs(mProfit)}`:""}</div></div>
    <a class="kpi ${pend?"alert":""}" href="#/orders" onclick="otab='pending'"><div class="l">To confirm</div><div class="v">${pend}</div><div class="muted">new orders</div></a>
    <a class="kpi" href="#/orders" onclick="otab='confirmed'"><div class="l">To ship</div><div class="v">${toShip}</div><div class="muted">confirmed / packed</div></a>
   </div>
   <div class="card"><h2>Sales — last 14 days</h2>${svg}</div>
   <div class="cols"><div class="card tcard"><div style="padding:14px 16px 6px"><h2>Latest orders</h2></div>${orderTable(orders.slice(0,8))}</div>
    <div><div class="card"><h2>Best sellers this month</h2>${topL.length?topL.map(([n,q])=>`<div class="sumrow"><span>${esc(n)}</span><b>${q}</b></div>`).join(""):`<div class="muted">No sales yet this month.</div>`}</div>
    <div class="card"><h2>Low stock</h2>${low.length?low.map(p=>`<div class="sumrow"><a href="#/products/${p.id}">${esc(p.name)}</a><b style="color:var(--red)">${p.stock}</b></div>`).join(""):`<div class="muted">All live products have stock.</div>`}</div>
    ${"Notification" in window&&Notification.permission==="default"?`<div class="card"><h2>New order alerts</h2><p class="muted" style="margin:0 0 8px">Get a pop-up when a new order comes in (keep this tab open).</p><button class="btn" onclick="Notification.requestPermission().then(()=>route())">Turn on alerts</button></div>`:""}

async function patchOrder(o,ch,msg){

async function adjustStock(o,dir){ // dir -1 = take out of stock, +1 = put back
  for(const i of o.items){const p=products.find(p=>p.id===i.id);if(!p)continue;
    try{const [n]=await api(`/rest/v1/products?id=eq.${p.id}`,{method:"PATCH",body:JSON.stringify({stock:Math.max(0,p.stock+dir*i.qty)})});Object.assign(p,n)}catch{}}

const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,70);
async function compress(file){
  const bmp=await createImageBitmap(file);const s=Math.min(1,1200/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/webp",.8));
}
async function upload(file){
  const blob=await compress(file);const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.webp`;
  const at=await token();
  const r=await fetch(`${SB}/storage/v1/object/products/${path}`,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+at,"Content-Type":"image/webp","x-upsert":"true"},body:blob});
  if(!r.ok)throw new Error("Photo upload failed");
  return `${SB}/storage/v1/object/public/products/${path}`;
}

  try{await api("/rest/v1/settings?key=eq.features",{method:"PATCH",body:JSON.stringify({value:next})});
    toast(`${val?"Turned on":"Turned off"}: ${el.getAttribute("aria-label")}`);if(k==="anim")featuresCard()}
  catch(er){settings.features=old;el.checked=!val;toast("Couldn't save: "+er.message)}
}

/* ---------- start ---------- */
async function start(){
  $("#login").classList.add("hidden");$("#os").classList.remove("hidden");
  M.innerHTML=`<div class="empty">Loading…</div>`;
  try{await loadAll();route()}catch(e){if(e.message!=="auth")M.innerHTML=`<div class="empty">Couldn't load data: ${esc(e.message)}. <button class="btn" onclick="start()">Try again</button></div>`}
}
if(sess)start();else logout();
</script>
</body>
